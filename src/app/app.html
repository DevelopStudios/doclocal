<div class="shell">
  <header class="topbar">
    <span class="brand">DocLocal</span>
    <div class="topbar-actions">
      <div class="theme-toggle">
        @for (t of themes; track t) {
          <button
            class="theme-btn"
            [class.active]="theme() === t"
            [attr.aria-pressed]="theme() === t"
            (click)="theme.set(t)"
          >
            {{ t }}
          </button>
        }
      </div>
      @if (auth.user(); as user) {
        <span class="signed-in-as"
          >Signed in as <strong>{{ user.username }}</strong></span
        >
        <button class="signout-btn" type="button" (click)="signOut()">Sign out</button>
      } @else if (door() === 'demo') {
        <button class="signout-btn" type="button" (click)="door.set('signin')">Sign in</button>
      } @else {
        <button class="signout-btn" type="button" (click)="door.set('demo')">Try the demo</button>
      }
    </div>
  </header>

  @if (auth.status() === 'signed-in') {
    <app-workspace />
  } @else if (door() === 'signin') {
    <app-login (tryDemo)="door.set('demo')" />
  } @else {
    <app-workspace [demo]="true" />
  }
</div>
