@if (collapsed()) {
  <!-- Collapsed there is no text anywhere in the rail, so an unlabelled arrow would be
       an unexplained arrow: the label and the tooltip carry the whole meaning. -->
  <button
    class="circle"
    type="button"
    disabled
    aria-disabled="true"
    title="Upgrade to Hosted — not available yet"
    aria-label="Upgrade to Hosted — not available yet"
  >
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor"
         stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="8" y1="13" x2="8" y2="3.5" />
      <polyline points="3.5 8 8 3.5 12.5 8" />
    </svg>
  </button>
} @else {
  <section class="shelf" aria-labelledby="hosted-shelf-title">
    <h2 class="title" id="hosted-shelf-title">Hosted</h2>
    <ul class="list">
      @for (feature of features; track feature.title) {
        <li class="item">
          <!-- Neutral, not accent and not evidence: a tick is punctuation, neither
               something to click nor a citation. -->
          <svg class="tick" width="12" height="12" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <polyline points="2.5 8.5 6 12 13.5 4" />
          </svg>
          <span class="text">
            <span class="item-title">{{ feature.title }}</span>
            <span class="item-detail">{{ feature.detail }}</span>
          </span>
        </li>
      }
    </ul>
    <button
      class="upgrade"
      type="button"
      disabled
      aria-disabled="true"
      title="The Hosted tier is not available yet"
    >
      Upgrade
    </button>
    <p class="price">$XX / month</p>
  </section>
}
